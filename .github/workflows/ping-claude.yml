name: Claude Ping

on:
  schedule:
    - cron: '0 0,4,9,14,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Antworte nur mit 'ok'."
          claude_args: "--max-turns 1 --model claude-haiku-4-5-20251001 --disallowed-tools Bash,Read,Write,Edit,Glob,Grep"
